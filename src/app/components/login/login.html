<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="brand-logo">Prompt<span>2</span>Website</h1>
    <p class="tagline">Generate full-stack code from a single prompt</p>
    <h2>Sign In</h2>
    <form (submit)="onLogin($event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="name@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="primary-btn">Sign In</button>
    </form>
    <p class="switch-auth">Don't have an account? <a routerLink="/register">Create Account</a></p>
  </div>
</div>
